<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Sora, Arial, sans-serif">
  <!-- Plano del local PokeCard: 10 m x 8 m (escala 1 m = 50 px) -->
  <rect width="640" height="520" fill="#F5F2FA"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a0f2e">Local PokeCard — planta (10 m × 8 m)</text>

  <g transform="translate(70 55)">
    <!-- Piso -->
    <rect x="0" y="0" width="500" height="400" fill="#ffffff"/>

    <!-- Depósito (arriba a la derecha, 3 x 3 m) -->
    <rect x="350" y="0" width="150" height="150" fill="#E8E3F2"/>
    <text x="425" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1a0f2e">Depósito</text>
    <text x="425" y="88" text-anchor="middle" font-size="10" fill="#3d2f5c">3 × 3 m</text>
    <line x1="350" y1="0" x2="350" y2="110" stroke="#1a0f2e" stroke-width="6"/>
    <line x1="350" y1="150" x2="500" y2="150" stroke="#1a0f2e" stroke-width="6"/>
    <path d="M350 110 A40 40 0 0 1 390 150" fill="none" stroke="#9B8FC0" stroke-width="2"/>

    <!-- Exhibidores contra la pared izquierda -->
    <rect x="10" y="20" width="40" height="120" rx="4" fill="#7B5CB0"/>
    <text x="30" y="80" text-anchor="middle" font-size="10" fill="#fff" transform="rotate(-90 30 80)">Cartas sueltas</text>
    <rect x="10" y="160" width="40" height="100" rx="4" fill="#7B5CB0"/>
    <text x="30" y="210" text-anchor="middle" font-size="10" fill="#fff" transform="rotate(-90 30 210)">Sobres</text>
    <rect x="10" y="280" width="40" height="80" rx="4" fill="#7B5CB0"/>
    <text x="30" y="320" text-anchor="middle" font-size="10" fill="#fff" transform="rotate(-90 30 320)">Mazos</text>

    <!-- Vitrina central de cartas de alto valor -->
    <rect x="130" y="40" width="160" height="50" rx="6" fill="#1a0f2e"/>
    <text x="210" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#F5F2FA">Vitrina con llave</text>
    <text x="210" y="78" text-anchor="middle" font-size="9" fill="#9B8FC0">cartas de alto valor</text>

    <!-- Mesa de juego -->
    <rect x="140" y="170" width="140" height="80" rx="8" fill="#9B8FC0"/>
    <text x="210" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#1a0f2e">Mesa de juego</text>
    <g fill="#3d2f5c">
      <circle cx="165" cy="160" r="8"/><circle cx="210" cy="160" r="8"/><circle cx="255" cy="160" r="8"/>
      <circle cx="165" cy="260" r="8"/><circle cx="210" cy="260" r="8"/><circle cx="255" cy="260" r="8"/>
    </g>

    <!-- Accesorios (pared derecha) -->
    <rect x="450" y="180" width="40" height="110" rx="4" fill="#7B5CB0"/>
    <text x="470" y="235" text-anchor="middle" font-size="10" fill="#fff" transform="rotate(90 470 235)">Accesorios</text>

    <!-- Mostrador / caja -->
    <path d="M330 310 h120 v60 h-30 v-30 h-90 z" fill="#E22B3F"/>
    <text x="385" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Mostrador / caja</text>

    <!-- Paredes exteriores con puerta de entrada abajo -->
    <path d="M200 400 H0 V0 H500 V400 H300" fill="none" stroke="#1a0f2e" stroke-width="8"/>
    <!-- Vidrieras -->
    <line x1="40" y1="400" x2="180" y2="400" stroke="#9B8FC0" stroke-width="4"/>
    <line x1="320" y1="400" x2="460" y2="400" stroke="#9B8FC0" stroke-width="4"/>
    <text x="110" y="420" text-anchor="middle" font-size="10" fill="#3d2f5c">Vidriera</text>
    <text x="390" y="420" text-anchor="middle" font-size="10" fill="#3d2f5c">Vidriera</text>
    <!-- Puerta -->
    <path d="M200 400 A50 50 0 0 1 250 350" fill="none" stroke="#9B8FC0" stroke-width="2"/>
    <line x1="250" y1="400" x2="250" y2="350" stroke="#9B8FC0" stroke-width="2"/>
    <text x="250" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1a0f2e">ENTRADA</text>

    <!-- QR de cada sector -->
    <g font-size="9" font-weight="700" fill="#fff">
      <rect x="215" y="365" width="22" height="22" fill="#1a0f2e"/><text x="226" y="380" text-anchor="middle">1</text>
      <rect x="58" y="70" width="22" height="22" fill="#1a0f2e"/><text x="69" y="85" text-anchor="middle">2</text>
      <rect x="58" y="200" width="22" height="22" fill="#1a0f2e"/><text x="69" y="215" text-anchor="middle">3</text>
      <rect x="58" y="310" width="22" height="22" fill="#1a0f2e"/><text x="69" y="325" text-anchor="middle">4</text>
      <rect x="420" y="225" width="22" height="22" fill="#1a0f2e"/><text x="431" y="240" text-anchor="middle">5</text>
      <rect x="340" y="345" width="22" height="22" fill="#1a0f2e"/><text x="351" y="360" text-anchor="middle">6</text>
    </g>
  </g>

  <!-- Referencias de los QR -->
  <g transform="translate(70 500)" font-size="10" fill="#1a0f2e">
    <text x="0" y="0">QR: 1 Entrada · 2 Cartas sueltas · 3 Sobres · 4 Mazos · 5 Accesorios · 6 Caja / Mis pedidos</text>
  </g>
</svg>
